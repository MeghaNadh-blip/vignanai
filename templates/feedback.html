{% extends "base.html" %}
{% block title %}Feedback | Vignan AI{% endblock %}
{% block page_label %}Feedback{% endblock %}
{% block content %}<section class="page-hero"><span class="eyebrow">Help us improve</span><h1>Send Feedback</h1><p>Share issues, feature ideas, or suggestions.</p></section><section class="panel"><form method="POST" class="premium-form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Subject<input name="subject" required placeholder="Short subject"></label><label>Message<textarea name="message" rows="7" required placeholder="Tell us what happened or what you want..."></textarea></label><button class="primary-btn" type="submit">Send Feedback</button></form></section>{% endblock %}
