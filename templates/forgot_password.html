{% extends "auth_base.html" %}
{% block title %}Forgot Password | Vignan AI{% endblock %}
{% block content %}
<div class="auth-card-head centered-auth-head">
  <span class="eyebrow">Account recovery</span>
  <h2>Get reset code</h2>
  <p class="muted">Enter your registered email. We’ll send a 6-digit code valid for 10 minutes.</p>
</div>
<form method="POST" action="{{ url_for('forgot_password') }}" class="premium-form auth-form-v2"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label class="input-shell"><span>Email</span><input type="email" name="email" placeholder="you@example.com" required></label>
  <button type="submit" class="primary-btn full auth-submit">Send Reset Code</button>
</form>
<p class="form-link"><a href="{{ url_for('login') }}">Back to login</a></p>
{% endblock %}
